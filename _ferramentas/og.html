<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Imagem de prévia (og.jpg). Gerar: Chrome sem janela em 1200x800, recortar 1200x630 do topo. -->
<style>
@font-face{font-family:'Space Grotesk';font-weight:500 700;src:url(../fonts/space-grotesk.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400 600;src:url(../fonts/inter.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;src:url(../fonts/jetbrains-mono.woff2) format('woff2')}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#060C18;color:#fff;font-family:Inter,sans-serif}
  .bg{position:absolute;inset:0;background:
    radial-gradient(760px 420px at 88% -10%,rgba(47,124,246,.42),transparent 62%),
    radial-gradient(520px 340px at 0% 110%,rgba(34,195,214,.20),transparent 62%),
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/48px 48px}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:18px}
  .brand svg{width:64px;height:64px}
  .brand b{display:block;font:700 30px/1 "Space Grotesk";letter-spacing:.08em}
  .brand small{display:block;margin-top:8px;font:500 15px/1 "JetBrains Mono";letter-spacing:.3em;color:#9DB0CF}
  h1{margin:58px 0 0;font:600 72px/1.04 "Space Grotesk";letter-spacing:-.03em;max-width:820px}
  h1 em{font-style:normal;background:linear-gradient(90deg,#7FB2FF,#5FDDEC);-webkit-background-clip:text;background-clip:text;color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto}
  .chips span{padding:10px 16px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.05);font:500 18px/1 "JetBrains Mono";color:#DCE6F5}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px;font:500 20px/1 "JetBrains Mono";color:#5FDDEC}
  .foot span:last-child{color:#9DB0CF}
  .ring{position:absolute;right:-60px;top:150px;width:420px;height:420px;border-radius:50%;border:1px dashed rgba(95,221,236,.35)}
  .ring::after{content:"";position:absolute;inset:70px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="ring"></div>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#0F2A5C"/><path fill="#fff" d="M14 12h20v5H20v4.5h11v5H20V31h14v5H14z"/><rect x="36" y="31" width="4" height="5" rx="1" fill="#5FDDEC"/></svg>
    <div><b>EDELMANN</b><small>TECNOLOGIA</small></div>
  </div>
  <h1>Tecnologia a serviço do <em>resultado do seu negócio.</em></h1>
  <div class="chips"><span>Consultoria em TI</span><span>Gestão de processos</span><span>+15 anos em TI</span><span>Pequenas e médias empresas</span></div>
  <div class="foot"><span>edelmann.com.br</span><span>Itaituba (PA) · videochamada</span></div>
</div>
</body>
</html>
