<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Arte da imagem de prévia img/og-2026.jpg (1200x630; nome novo para furar o cache do WhatsApp).
     Gerar: servir a RAIZ do site por HTTP (file:// não carrega as fontes) e capturar com Chrome/playwright
     em viewport 1200x630, JPEG qualidade 88. Ex.: python -m http.server 8814  ->  http://localhost:8814/_ferramentas/og.html -->
<style>
@font-face{font-family:'Space Grotesk';src:url('../fonts/space-grotesk.woff2') format('woff2');font-weight:300 700}
@font-face{font-family:Inter;src:url('../fonts/inter.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'JetBrains Mono';src:url('../fonts/jetbrains-mono.woff2') format('woff2');font-weight:100 800}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#060C18;font-family:Inter,sans-serif;color:#C7D2E4}
.grid{position:absolute;inset:0;background:
 radial-gradient(50rem 28rem at 82% -5%,rgba(47,124,246,.32),transparent 60%),
 radial-gradient(34rem 22rem at 5% 105%,rgba(34,195,214,.12),transparent 60%),
 linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px}
.motivo{position:absolute;top:70px;bottom:70px;right:56px;width:420px;
 background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 560' fill='none'><g stroke='%237FB2FF' stroke-opacity='.45' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M40 120H200l60 60H420l60-60H680'/><path d='M200 120V40'/><path d='M260 180V320H120V460'/><path d='M420 180V260l80 80H680'/><path d='M500 340V500H300l-60-60H40'/><path d='M120 320H40'/><path d='M600 120V40'/><path d='M600 340V260'/></g><g stroke='%237FB2FF' stroke-opacity='.32' stroke-width='1.5' stroke-dasharray='2 8' stroke-linecap='round'><path d='M260 320H420V260'/><path d='M680 340V520'/><path d='M40 120V320'/></g><g fill='%23060C18' stroke='%235FDDEC' stroke-width='2'><circle cx='200' cy='120' r='7'/><circle cx='420' cy='180' r='7'/><circle cx='500' cy='340' r='7'/><circle cx='120' cy='460' r='7'/><rect x='253' y='313' width='14' height='14' rx='3'/><rect x='593' y='113' width='14' height='14' rx='3'/></g><g fill='%235FDDEC'><circle cx='260' cy='180' r='3.5'/><circle cx='680' cy='120' r='3.5'/><circle cx='200' cy='40' r='3.5'/><circle cx='120' cy='320' r='3.5'/><circle cx='680' cy='340' r='3.5'/><circle cx='300' cy='500' r='3.5'/><circle cx='600' cy='260' r='3.5'/><circle cx='40' cy='440' r='3.5'/></g></svg>") no-repeat 100% 50%/contain}
.conteudo{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:64px;height:64px}
.brand b{display:block;font:600 30px/1 'Space Grotesk';letter-spacing:.01em;color:#fff}
.brand small{display:block;margin-top:7px;font:500 13px/1 'JetBrains Mono';letter-spacing:.42em;color:#9FB0CC;text-transform:uppercase}
h1{max-width:780px;font:600 64px/1.12 'Space Grotesk';letter-spacing:-.015em;color:#fff;text-wrap:balance}
h1 em{font-style:normal;color:#7FB2FF}
.base{display:flex;align-items:center;gap:22px}
.chip{font:500 15px/1 'JetBrains Mono';letter-spacing:.14em;color:#9FB0CC;text-transform:uppercase}
.dot{width:5px;height:5px;border-radius:50%;background:#5FDDEC}
.url{font:600 19px/1 'Space Grotesk';color:#fff}
.fio{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#2F7CF6,#5FDDEC)}
</style></head><body>
<div class="grid"></div>
<div class="motivo"></div>
<div class="conteudo">
  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#0F2A5C"/><path d="M14 12h20v5H20v4.5h11v5H20V31h14v5H14z" fill="#FFFFFF"/><rect x="36" y="31" width="4" height="5" rx="1" fill="#5FDDEC"/></svg>
    <span><b>Edelmann</b> <small>Tecnologia</small></span>
  </div>
  <h1>Consultoria em TI que mostra onde a sua empresa <em>perde tempo e dinheiro.</em></h1>
  <div class="base"><span class="chip">De Itaituba a Santarém (PA)</span><span class="dot"></span><span class="url">edelmann.com.br</span></div>
</div>
<div class="fio"></div>
</body></html>
